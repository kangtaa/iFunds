name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 版本号
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          Write-Output "v=$v" >> $env:GITHUB_OUTPUT

      - name: 构建
        run: >
          dotnet publish iFunds/iFunds.csproj
          -c Release -r win-x64 -p:Platform=x64
          -p:SelfContained=true -p:WindowsAppSDKSelfContained=true

      - name: 便携版 zip
        shell: pwsh
        run: |
          Compress-Archive -Path iFunds/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/publish/* `
                           -DestinationPath iFunds_portable_x64.zip

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: EXE 安装包
        shell: pwsh
        run: |
          iscc /Qp installer.iss /DMyAppVersion="${{ steps.ver.outputs.v }}" /F"iFunds_Setup_x64"

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iFunds_portable_x64.zip
            iFunds_Setup_x64.exe
          name: ${{ github.ref_name }}
          generate_release_notes: true
