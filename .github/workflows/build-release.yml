name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原依赖
        run: dotnet restore iFunds/iFunds.csproj

      # ── 自包含构建 ──
      - name: 构建
        run: >
          dotnet publish iFunds/iFunds.csproj
          -c Release
          -r win-x64
          -p:Platform=x64
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          --no-restore

      - name: 打包便携版 zip
        shell: pwsh
        run: |
          Compress-Archive -Path iFunds/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/publish/* `
                           -DestinationPath iFunds_portable_x64.zip

      # ── Inno Setup 安装包 ──
      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 提取版本号
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          Write-Output "ver=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver"

      - name: 构建安装包
        shell: pwsh
        run: |
          $publishDir = "iFunds/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/publish"
          iscc /Qp installer.iss /DMyAppVersion="${{ steps.version.outputs.ver }}" /O"..\..\..\..\" /F"iFunds_Setup_x64"
        working-directory: iFunds\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64

      - name: 验证安装包
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path iFunds/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64 -Filter "iFunds_Setup*.exe" | Select-Object -First 1
          if ($setup) {
            $sizeMB = [math]::Round($setup.Length / 1MB, 1)
            Write-Host "Installer: $($setup.Name) ($sizeMB MB)"
            Write-Output "path=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Installer not found!"
            Get-ChildItem -Recurse -Path . -Filter "iFunds_Setup*"
          }
        id: setup_exe
        working-directory: iFunds\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iFunds_portable_x64.zip
            iFunds/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/iFunds_Setup_x64.exe
          name: ${{ github.ref_name }}
          generate_release_notes: true
