name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原依赖
        run: dotnet restore iFunds/iFunds.csproj

      # ── Step 1: 自包含免安装包 ──
      - name: 构建自包含包
        run: >
          dotnet publish iFunds/iFunds.csproj
          -c Release
          -r win-x64
          -p:Platform=x64
          -p:WindowsAppSDKSelfContained=true
          -p:SelfContained=true
          --no-restore

      - name: 打包 zip
        shell: pwsh
        run: |
          Compress-Archive -Path iFunds/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/publish/* `
                           -DestinationPath iFunds_portable_x64.zip

      # 清理后构建 MSIX，避免两次 publish 相互干扰
      - name: 清理
        run: dotnet clean iFunds/iFunds.csproj -c Release

      # ── Step 2: MSIX 安装包 ──
      - name: 构建 MSIX
        run: >
          dotnet publish iFunds/iFunds.csproj
          -c Release
          -r win-x64
          -p:Platform=x64
          -p:AppxPackageSigningEnabled=true
          -p:AppxPackage=true
          --no-restore

      - name: 查找 MSIX
        id: msix
        shell: pwsh
        run: |
          $pkgs = Get-ChildItem -Recurse -Path iFunds/bin -Include "*.msix","*.msixbundle" |
                  Where-Object { $_.Name -notlike "*CodeSign*" } |
                  Sort-Object LastWriteTime -Descending
          if (-not $pkgs) { $pkgs = Get-ChildItem -Recurse -Path iFunds -Filter "*.msix" }
          foreach ($p in $pkgs) { Write-Host "Found: $($p.FullName) ($($p.Length) bytes)" }
          $best = $pkgs | Select-Object -First 1
          if ($best) {
            Write-Output "path=$($best.FullName)" >> $env:GITHUB_OUTPUT
            Write-Output "name=$($best.Name)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No MSIX found! Listing bin contents:"
            Get-ChildItem -Recurse -Path iFunds/bin | Select-Object -First 40 | ForEach-Object { Write-Host $_ }
          }

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iFunds_portable_x64.zip
            ${{ steps.msix.outputs.path }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
