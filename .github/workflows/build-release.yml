name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 版本号
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          Write-Output "v=$v" >> $env:GITHUB_OUTPUT

      - name: 还原
        run: dotnet restore iFunds/iFunds.csproj

      - name: 构建
        run: >
          dotnet publish iFunds/iFunds.csproj
          -c Release -r win-x64 -p:Platform=x64
          -p:SelfContained=true -p:WindowsAppSDKSelfContained=true
          --no-restore

      # ── ① zip ──
      - name: ① 便携版 zip
        shell: pwsh
        run: |
          Compress-Archive -Path iFunds/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/publish/* `
                           -DestinationPath iFunds_portable_x64.zip

      # ── ② EXE (Inno Setup) ──
      - name: Inno Setup + WiX
        run: |
          choco install innosetup wixtoolset -y --no-progress
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: ② EXE 安装包
        shell: pwsh
        run: |
          iscc /Qp installer.iss /DMyAppVersion="${{ steps.ver.outputs.v }}" /F"iFunds_Setup_x64" 2>&1
          $e = Get-Item "iFunds_Setup_x64.exe"
          Write-Host "EXE: $([math]::Round($e.Length/1MB,1)) MB"
          Write-Output "exe=$($e.FullName)" >> $env:GITHUB_OUTPUT
        id: exe

      # ── ③ MSI (WiX v3) ──
      - name: ③ MSI 安装包
        shell: pwsh
        run: |
          $pub = "iFunds/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/publish"
          $ver = "${{ steps.ver.outputs.v }}"
          # 替换版本号
          (Get-Content installer.wxs) -replace '__VERSION__', $ver | Set-Content installer_v.wxs
          # 用 heat 采集所有文件
          heat dir $pub -dr INSTALLFOLDER -cg AppFiles -gg -g1 -sfrag -srd -var var.PublishDir -out AppFiles.wxs
          # 编译
          candle -arch x64 "-dPublishDir=$pub" installer_v.wxs AppFiles.wxs
          # 链接
          light -ext WixUIExtension -o iFunds_Setup_x64.msi installer_v.wixobj AppFiles.wixobj
          $m = Get-Item "iFunds_Setup_x64.msi"
          Write-Host "MSI: $([math]::Round($m.Length/1MB,1)) MB"
          Write-Output "msi=$($m.FullName)" >> $env:GITHUB_OUTPUT
        id: msi

      # ── ④ MSIX ──
      - name: ④ MSIX 安装包
        run: >
          dotnet publish iFunds/iFunds.csproj
          -c Release -p:Platform=x64
          -p:AppxPackageSigningEnabled=true
          -p:SelfContained=true -p:WindowsAppSDKSelfContained=true
          --no-restore

      - name: 查找 MSIX
        id: msix
        shell: pwsh
        run: |
          $p = Get-ChildItem -Recurse -Path iFunds -Filter "*.msix" |
               Where-Object { $_.FullName -notlike "*\obj\*" -and $_.Name -notlike "*CodeSign*" } |
               Sort-Object Length -Descending | Select-Object -First 1
          if ($p) {
            Write-Host "MSIX: $([math]::Round($p.Length/1MB,1)) MB"
            Write-Output "msix=$($p.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "MSIX not found (skipped)"
          }

      # ── 发布 ──
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iFunds_portable_x64.zip
            ${{ steps.exe.outputs.exe }}
            ${{ steps.msi.outputs.msi }}
            ${{ steps.msix.outputs.msix }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
